name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runner note: the build host shares the app's macOS 26 floor, so CI runs on
# `macos-26`. A `macos-15` runner is excluded by `make doctor` rather than by the
# SDK — Xcode 26.0 can target macOS 26 from macOS 15.6, but the project does not
# claim to build on an OS generation it never tests against. That is what makes
# the floor runtime-tested rather than a compile-only deployment target.
jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Install build toolchain
        run: brew bundle

      - name: Doctor (environment check)
        run: make doctor

      - name: Verify (full gate)
        run: make verify
        env:
          # Sandbox-safe temp dir, mirroring verify.sh's own redirection.
          TMPDIR: ${{ github.workspace }}/.build/tmp
